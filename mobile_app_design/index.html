<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Expiry App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Food Expiry App</h1>
        
        <button class="theme-toggle">
            <i class="fas fa-moon"></i>
            <span>Dark Mode</span>
        </button>
        
        <!-- Language Selector -->
        <div class="language-selector">
            <button class="language-btn active" data-lang="en">English</button>
            <button class="language-btn" data-lang="zh">中文</button>
            <button class="language-btn" data-lang="ja">日本語</button>
            <button class="language-btn" data-lang="th">ไทย</button>
            <button class="language-btn" data-lang="ms">Bahasa Melayu</button>
        </div>
        
        <!-- Dashboard -->
        <div class="prototype-screen">
            <h2>Dashboard</h2>
            <div class="phone-frame">
                <div class="status-bar">
                    <span id="current-time">9:41</span>
                    <span><i class="fas fa-signal"></i> <i class="fas fa-wifi"></i> <i class="fas fa-battery-full"></i></span>
                </div>
                <div class="screen-content dashboard">
                    <div class="header">
                        <h3 data-translate="app.title">Food Expiry</h3>
                        <div class="header-actions">
                            <button class="icon-btn" id="notification-btn"><i class="fas fa-bell"></i></button>
                            <button class="icon-btn" id="settings-btn"><i class="fas fa-cog"></i></button>
                        </div>
                    </div>
                    <div class="welcome-banner">
                        <div class="welcome-text">
                            <h4 data-translate="dashboard.welcome">Welcome Back!</h4>
                            <p><strong id="expiring-count">0</strong> <span data-translate="dashboard.expiringItems">items expiring soon</span></p>
                        </div>
                        <i class="fas fa-utensils banner-icon"></i>
                    </div>
                    <div class="quick-stats">
                        <div class="stat-card">
                            <i class="fas fa-exclamation-circle warning"></i>
                            <span data-translate="dashboard.expiringSoon">Expiring Soon</span>
                            <strong id="expiring-soon-count">0</strong>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-check-circle success"></i>
                            <span data-translate="dashboard.fresh">Fresh</span>
                            <strong id="fresh-count">0</strong>
                        </div>
                    </div>

                    <!-- Storage Locations -->
                    <div class="location-list">
                        <div class="category-actions">
                            <h4 data-translate="dashboard.storageLocations">Storage Locations</h4>
                            <button class="action-btn" id="add-location-btn"><i class="fas fa-plus"></i></button>
                        </div>
                        <div class="locations" id="locations-container">
                            <!-- Locations will be dynamically added here -->
                        </div>
                    </div>

                    <div class="category-list">
                        <div class="category-actions">
                            <h4 data-translate="dashboard.categories">Categories</h4>
                            <button class="action-btn" id="add-category-btn"><i class="fas fa-plus"></i></button>
                        </div>
                        <div class="categories" id="categories-container">
                            <!-- Categories will be dynamically added here -->
                        </div>
                    </div>

                    <div class="food-sections">
                        <!-- Expiring Soon Section -->
                        <div class="food-section">
                            <div class="section-header">
                                <h4>
                                    <i class="fas fa-exclamation-circle warning"></i>
                                    <span data-translate="dashboard.expiringSoon">Expiring Soon</span>
                                    <span class="count warning" id="expiring-section-count">0</span>
                                </h4>
                                <button class="action-btn" id="sort-expiring-btn">
                                    <i class="fas fa-sort"></i>
                                </button>
                            </div>
                            <div class="section-content" id="expiring-items-container">
                                <!-- Expiring items will be dynamically added here -->
                            </div>
                        </div>

                        <!-- Fresh Items Section -->
                        <div class="food-section">
                            <div class="section-header">
                                <h4>
                                    <i class="fas fa-check-circle success"></i>
                                    <span data-translate="dashboard.fresh">Fresh</span>
                                    <span class="count" id="fresh-section-count">0</span>
                                </h4>
                                <button class="action-btn" id="sort-fresh-btn">
                                    <i class="fas fa-sort"></i>
                                </button>
                            </div>
                            <div class="section-content" id="fresh-items-container">
                                <!-- Fresh items will be dynamically added here -->
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Navigation -->
                    <div class="bottom-nav">
                        <div class="nav-item active" data-screen="dashboard">
                            <i class="fas fa-home"></i>
                            <span data-translate="nav.home">Home</span>
                        </div>
                        <div class="nav-item" data-screen="list">
                            <i class="fas fa-list"></i>
                            <span data-translate="nav.list">List</span>
                        </div>
                        <div class="nav-item add-btn" data-screen="add">
                            <i class="fas fa-plus"></i>
                        </div>
                        <div class="nav-item" data-screen="calendar">
                            <i class="fas fa-calendar"></i>
                            <span data-translate="nav.calendar">Calendar</span>
                        </div>
                        <div class="nav-item" data-screen="settings">
                            <i class="fas fa-cog"></i>
                            <span data-translate="nav.settings">Settings</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Add Item Modal -->
        <div class="modal-overlay" id="add-item-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 data-translate="addItem.title">Add Food Item</h3>
                    <button class="modal-close"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-content">
                    <div class="form-group">
                        <label for="item-name" data-translate="form.name">Name</label>
                        <input type="text" id="item-name" placeholder="Enter food name">
                    </div>
                    <div class="form-group">
                        <label for="item-category" data-translate="form.category">Category</label>
                        <select id="item-category">
                            <!-- Categories will be dynamically added here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-location" data-translate="form.location">Location</label>
                        <select id="item-location">
                            <!-- Locations will be dynamically added here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-expiry" data-translate="form.expiryDate">Expiry Date</label>
                        <input type="date" id="item-expiry">
                    </div>
                    <div class="form-group">
                        <label for="item-reminder" data-translate="form.reminderDays">Reminder Days</label>
                        <input type="number" id="item-reminder" value="3" min="0">
                    </div>
                    <div class="form-group">
                        <label for="item-quantity" data-translate="form.quantity">Quantity</label>
                        <input type="number" id="item-quantity" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label for="item-notes" data-translate="form.notes">Notes</label>
                        <textarea id="item-notes" placeholder="Add notes (optional)"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn cancel" data-translate="button.cancel">Cancel</button>
                    <button class="modal-btn confirm" data-translate="button.save">Save</button>
                </div>
            </div>
        </div>
        
        <!-- Add Category Modal -->
        <div class="modal-overlay" id="add-category-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 data-translate="addCategory.title">Add Category</h3>
                    <button class="modal-close"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-content">
                    <div class="form-group">
                        <label for="category-name" data-translate="form.name">Name</label>
                        <input type="text" id="category-name" placeholder="Enter category name">
                    </div>
                    <div class="form-group">
                        <label for="category-icon" data-translate="form.icon">Icon</label>
                        <div class="icon-selector" id="category-icon-selector">
                            <button class="icon-option" data-icon="fa-carrot"><i class="fas fa-carrot"></i></button>
                            <button class="icon-option" data-icon="fa-apple-alt"><i class="fas fa-apple-alt"></i></button>
                            <button class="icon-option" data-icon="fa-egg"><i class="fas fa-egg"></i></button>
                            <button class="icon-option" data-icon="fa-drumstick-bite"><i class="fas fa-drumstick-bite"></i></button>
                            <button class="icon-option" data-icon="fa-fish"><i class="fas fa-fish"></i></button>
                            <button class="icon-option" data-icon="fa-bread-slice"><i class="fas fa-bread-slice"></i></button>
                            <button class="icon-option" data-icon="fa-cheese"><i class="fas fa-cheese"></i></button>
                            <button class="icon-option" data-icon="fa-cookie"><i class="fas fa-cookie"></i></button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn cancel" data-translate="button.cancel">Cancel</button>
                    <button class="modal-btn confirm" data-translate="button.save">Save</button>
                </div>
            </div>
        </div>
        
        <!-- Add Location Modal -->
        <div class="modal-overlay" id="add-location-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 data-translate="addLocation.title">Add Location</h3>
                    <button class="modal-close"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-content">
                    <div class="form-group">
                        <label for="location-name" data-translate="form.name">Name</label>
                        <input type="text" id="location-name" placeholder="Enter location name">
                    </div>
                    <div class="form-group">
                        <label for="location-icon" data-translate="form.icon">Icon</label>
                        <div class="icon-selector" id="location-icon-selector">
                            <button class="icon-option" data-icon="fa-door-closed"><i class="fas fa-door-closed"></i></button>
                            <button class="icon-option" data-icon="fa-snowflake"><i class="fas fa-snowflake"></i></button>
                            <button class="icon-option" data-icon="fa-box"><i class="fas fa-box"></i></button>
                            <button class="icon-option" data-icon="fa-archive"><i class="fas fa-archive"></i></button>
                            <button class="icon-option" data-icon="fa-warehouse"><i class="fas fa-warehouse"></i></button>
                            <button class="icon-option" data-icon="fa-shopping-basket"><i class="fas fa-shopping-basket"></i></button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn cancel" data-translate="button.cancel">Cancel</button>
                    <button class="modal-btn confirm" data-translate="button.save">Save</button>
                </div>
            </div>
        </div>
        
        <!-- Delete Confirmation Modal -->
        <div class="modal-overlay" id="delete-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 data-translate="deleteConfirmation.title">Delete Item</h3>
                    <button class="modal-close"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-content">
                    <div class="delete-confirmation">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p data-translate="deleteConfirmation.message">Are you sure you want to delete this item?</p>
                        <p class="item-name" id="delete-item-name"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn cancel" data-translate="button.cancel">Cancel</button>
                    <button class="modal-btn confirm delete" data-translate="button.delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
