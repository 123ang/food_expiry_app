<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Expiry Alert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 420px; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 40px 30px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin-bottom: 4px; color: #1a1a1a; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 28px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    input[type="password"] { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s; }
    input[type="password"]:focus { border-color: #22c55e; }
    .btn { width: 100%; padding: 14px; background: #22c55e; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .btn:hover { background: #16a34a; }
    .btn:disabled { background: #a3e6bc; cursor: not-allowed; }
    .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 16px; display: none; }
    .success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; border-radius: 10px; padding: 20px; font-size: 15px; display: none; }
    .success h2 { font-size: 18px; margin-bottom: 8px; }
    .success p { margin-bottom: 12px; }
    .success a { color: #22c55e; text-decoration: none; font-weight: 600; }
    .req { font-size: 12px; color: #999; margin-top: 4px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <!-- Form -->
    <div class="card" id="formCard">
      <div class="logo">🍎</div>
      <h1>Reset Your Password</h1>
      <p class="subtitle">Enter your new password below</p>

      <div class="error" id="errorBox"></div>

      <form id="resetForm" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="Enter new password" required minlength="6" autocomplete="new-password">
          <p class="req">Minimum 6 characters</p>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn" id="submitBtn">Reset Password</button>
      </form>
    </div>

    <!-- Success -->
    <div class="card success" id="successCard">
      <div class="logo">✅</div>
      <h2>Password Reset!</h2>
      <p>Your password has been changed successfully. You can now log in with your new password.</p>
      <p><a href="expiryalert://login">Open Expiry Alert App</a></p>
    </div>
  </div>

  <script>
    function getToken() {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function showError(msg) {
      var box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    if (!getToken()) {
      document.getElementById('formCard').innerHTML =
        '<div class="logo">⚠️</div><h1>Invalid Link</h1>' +
        '<p class="subtitle">This password reset link is invalid or has expired. Please request a new one from the app.</p>';
    }

    function handleSubmit(e) {
      e.preventDefault();
      hideError();

      var pw = document.getElementById('password').value;
      var cpw = document.getElementById('confirmPassword').value;

      if (pw.length < 6) { showError('Password must be at least 6 characters.'); return false; }
      if (pw !== cpw) { showError('Passwords do not match.'); return false; }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Resetting…';

      var apiBase = window.location.origin + '/api';

      fetch(apiBase + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: getToken(), password: pw })
      })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) {
          showError(result.data.error || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
          return;
        }
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
      })
      .catch(function() {
        showError('Network error. Please check your connection and try again.');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      });

      return false;
    }
  </script>
</body>
</html>
